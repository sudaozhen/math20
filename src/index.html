<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="学习中心">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <script>
    // 5. 注册 Service Worker (如果你想做离线功能)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
        });
    }
    </script>
    <style>
        /* 语音播报开关样式 */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; margin-right: 8px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success, #2196F3); }
        input:checked + .slider:before { transform: translateX(26px); }
        .stats-bar .stat-box { align-items: center; }
    </style>
    <title>学习中心</title>
</head>
<body>

<div id="home-page">
    <h1 class="home-title">iPad 学习中心</h1>
    <div class="app-grid">
        <div class="app-card math" onclick="launchApp('math20')">
            <span class="app-icon">🔢</span>
            <span class="app-name">20以内口算</span>
        </div>
        <div class="app-card" style="opacity: 0.6; cursor: not-allowed;">
            <span class="app-icon">⏰</span>
            <span class="app-name">敬请期待</span>
        </div>
    </div>
</div>

<div id="game-container" style="display: none;">
    <div class="sidebar-overlay" onclick="toggleHistory()"></div>
    <div class="sidebar">
        <div class="sidebar-header">答题记录</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-content">
        <!-- 新增顶部工具栏：包含退出、语音、重读 -->
        <div class="app-toolbar">
            <button class="back-btn" onclick="goHome()">🏠 退出</button>
            <div style="display: flex; align-items: center;">
                <span style="font-size: 0.8rem; margin-right: 4px;">语音报题</span>
                <label class="switch" title="切换语音报题" style="margin: 0 4px; transform: scale(0.8);">
                    <input type="checkbox" id="tts-toggle">
                    <span class="slider"></span>
                </label>
                <span style="font-size: 0.8rem; margin-left: 8px; margin-right: 4px;">重复题目</span>
                <button onclick="repeatQuestion()" style="background: none; border: none; font-size: 1.2rem; padding: 0; cursor: pointer;" title="重读题目">🔁</button>
            </div>
        </div>

        <div class="stats-bar">
            <button class="history-trigger" onclick="toggleHistory()">🕒 记录</button>
            <div class="stat-box"><span class="stat-val" id="s-total">0</span><span class="stat-lab">总数</span></div>
            <div class="stat-box"><span class="stat-val" id="s-ok" style="color:var(--success)">0</span><span class="stat-lab">正确</span></div>
            <div class="stat-box"><span class="stat-val" id="s-no" style="color:var(--danger)">0</span><span class="stat-lab">错误</span></div>
        </div>
        <div class="quiz-area">
            <div id="question"></div>
            <div id="answer-view"></div>
        </div>
        <div class="keypad-container">
            <div class="keypad">
                <!-- JS will render buttons here -->
            </div>
        </div>
    </div>
</div>

<script src="tts.js"></script>
<script src="keypad.js"></script>
<script src="math20.js"></script>
<script>
    // --- 路由逻辑 ---
    function launchApp(appName) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        if (appName === 'math20') {
            // 确保 math20.js 提供了 handleKeypadInput 函数来处理键盘输入
            if (typeof makeQuiz === 'function' && typeof handleKeypadInput === 'function') {
                renderKeypad('.keypad-container', handleKeypadInput); // 渲染通用键盘组件
                makeQuiz();
            }
        }
    }

    function goHome() {
        if(confirm("确定要退出练习吗？")) {
            document.getElementById('home-page').style.display = 'flex';
            document.getElementById('game-container').style.display = 'none';
        }
    }
</script>
</body>
</html>
