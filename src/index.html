<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="学习中心">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <script>
    // 5. 注册 Service Worker (如果你想做离线功能)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
        });
    }
    </script>
    <title>学习中心</title>
</head>
<body>

<div id="home-page">
    <h1 class="home-title">iPad 学习中心</h1>
    <div class="app-grid">
        <div class="app-card math" onclick="launchApp('math20')">
            <span class="app-icon">🔢</span>
            <span class="app-name">20以内口算</span>
        </div>
        <div class="app-card" style="opacity: 0.6; cursor: not-allowed;">
            <span class="app-icon">⏰</span>
            <span class="app-name">敬请期待</span>
        </div>
    </div>
</div>

<div id="game-container" style="display: none;">
    <button class="back-btn" onclick="goHome()">🏠 退出</button>
    
    <div class="sidebar-overlay" onclick="toggleHistory()"></div>
    <div class="sidebar">
        <div class="sidebar-header">答题记录</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-content">
        <div class="stats-bar">
            <button class="history-trigger" onclick="toggleHistory()">🕒 记录</button>
            <div class="stat-box"><span class="stat-val" id="s-total">0</span><span class="stat-lab">总数</span></div>
            <div class="stat-box"><span class="stat-val" id="s-ok" style="color:var(--success)">0</span><span class="stat-lab">正确</span></div>
            <div class="stat-box"><span class="stat-val" id="s-no" style="color:var(--danger)">0</span><span class="stat-lab">错误</span></div>
        </div>
        <div class="quiz-area">
            <div id="question"></div>
            <div id="answer-view"></div>
        </div>
        <div class="keypad-container">
            <div class="keypad">
                <!-- JS will render buttons here -->
            </div>
        </div>
    </div>
</div>

<script src="math20.js"></script>
<script>
    // --- 路由逻辑 ---
    function launchApp(appName) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        if(appName === 'math20') {
            if (typeof makeQuiz === 'function') {
                renderKeypad(); // Ensure keypad is rendered
                makeQuiz();
            }
        }
    }

    function goHome() {
        if(confirm("确定要退出练习吗？")) {
            document.getElementById('home-page').style.display = 'flex';
            document.getElementById('game-container').style.display = 'none';
        }
    }
</script>
</body>
</html>
