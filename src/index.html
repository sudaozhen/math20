<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 防止 HTTP 环境下 index.html 被强缓存，确保版本检测准确 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="学习中心">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <style>
        /* 语音播报开关样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-right: 8px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--success, #2196F3);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .stats-bar .stat-box {
            align-items: center;
        }
    </style>
    <title>口算练习</title>
</head>

<body>

    <div id="home-page">
        <h1 class="home-title">口算练习</h1>
        <div class="app-grid">
            <div class="app-card math" onclick="launchApp('math10')">
                <span class="app-icon">🔢</span>
                <span class="app-name">10以内加减法</span>
            </div>
            <div class="app-card math" onclick="launchApp('math20')">
                <span class="app-icon">🔢</span>
                <span class="app-name">20以内加减法</span>
            </div>
            <div class="app-card math" onclick="launchApp('math50')">
                <span class="app-icon">🔢</span>
                <span class="app-name">50以内加减法</span>
            </div>
            <div class="app-card math" onclick="launchApp('mathMul')">
                <span class="app-icon">✖️</span>
                <span class="app-name">乘法表</span>
            </div>
            <div class="app-card math" onclick="launchApp('mathDiv')">
                <span class="app-icon">➗</span>
                <span class="app-name">除法表</span>
            </div>
            <div class="app-card math" onclick="launchApp('math100')">
                <span class="app-icon">🔢</span>
                <span class="app-name">两位数加减法</span>
            </div>
            <div class="app-card math" onclick="launchApp('mathChain')">
                <span class="app-icon">➕</span>
                <span class="app-name">两位数连加</span>
            </div>
            <div class="app-card math" onclick="launchApp('mathChainSub')">
                <span class="app-icon">➖</span>
                <span class="app-name">两位数连减</span>
            </div>
            <div class="app-card math" onclick="launchApp('mathMix')">
                <span class="app-icon">🔀</span>
                <span class="app-name">两位数加减混合</span>
            </div>
        </div>
        <div id="version-display" style="margin-top: auto; padding-top: 20px; color: #888; font-size: 0.9rem;"></div>
    </div>

    <div id="game-container" style="display: none;">
        <!-- 游戏通用布局将由 uitemplate.js 动态渲染 -->
    </div>

    <script src="uitemplate.js"></script>
    <script src="tts.js"></script>
    <script src="scratchpad.js"></script>
    <script src="keypad.js"></script>
    <script type="module" src="main.js"></script>
    <script>
        // --- 路由逻辑 ---
        let currentAppModule = null;

        window.addEventListener('load', () => {
            fetch('version.json')
                .then(response => response.json())
                .then(data => {
                    const versionDisplay = document.getElementById('version-display');
                    if (versionDisplay) {
                        versionDisplay.textContent = `版本号: ${data.version}`;
                    }
                })
                .catch(err => console.error('Failed to load version:', err));
        });

        function launchApp(appName) {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            const gameTitles = { math10: '10以内加减法', math20: '20以内加减法', math50: '50以内加减法', mathMul: '乘法表', mathDiv: '除法表', math100: '两位数加减法', mathChain: '两位数连加', mathChainSub: '两位数连减', mathMix: '两位数加减混合' };
            const gameTitle = gameTitles[appName];

            // 渲染通用游戏界面, 并显示退出按钮
            renderGameLayout(document.getElementById('game-container'), { showExitButton: true, m_title: gameTitle });

            // 初始化草稿板
            scratchpad.init('scratchpad-canvas');

            import('./mathgame.js')
                .then(lib => {
                    currentAppModule = lib.createGame(appName);

                    // 1. 绑定键盘事件到当前模块的 handleKeypadInput
                    renderKeypad('.keypad-container', (key) => {
                        if (currentAppModule && currentAppModule.handleKeypadInput) {
                            currentAppModule.handleKeypadInput(key);
                        }
                    });

                    // 2. 初始化 TTS 开关
                    currentAppModule.setupTtsToggle();

                    // 3. 将全局按钮功能指向当前模块 (例如: 重复读题, 查看历史)
                    window.repeatQuestion = () => {
                        if (currentAppModule && currentAppModule.repeatQuestion) currentAppModule.repeatQuestion();
                    };
                    window.toggleHistory = () => {
                        if (currentAppModule && currentAppModule.toggleHistory) currentAppModule.toggleHistory();
                    };

                    // 4. 开始出题
                    currentAppModule.makeQuiz();
                })
                .catch(error => {
                    console.error(`Failed to load game ${appName}`, error);
                });
        }

        function goHome() {
            if (confirm("确定要退出练习吗？")) {
                document.getElementById('home-page').style.display = 'flex';
                document.getElementById('game-container').style.display = 'none';
            }
        }
    </script>


</body>

</html>
