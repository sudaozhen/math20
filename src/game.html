<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>口算练习</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 语音播报开关样式 */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; margin-right: 8px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success, #2196F3); }
        input:checked + .slider:before { transform: translateX(26px); }
        .stats-bar .stat-box { align-items: center; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 游戏通用布局将由 uitemplate.js 动态渲染 -->
</div>

<script src="uitemplate.js"></script>
<script src="tts.js"></script>
<script src="scratchpad.js"></script>
<script src="keypad.js"></script>
<script type="module">
    // 注意: import 声明必须在模块顶层，不能放进 if/else 块（否则整个脚本 SyntaxError）
    import { createGame } from './mathgame.js';
    import './main.js'; // For update checker

    // 用法: game.html?g=math10|math20|math50 (缺省 math20)
    const TITLES = { math10: '10以内加减法', math20: '20以内加减法', math50: '50以内加减法', mathMul: '乘法表', mathDiv: '除法表', math100: '两位数加减法', mathChain: '两位数连加', mathChainSub: '两位数连减', mathMix: '两位数加减混合' };
    const name = new URLSearchParams(location.search).get('g');
    if (!TITLES[name]) {
        location.replace(name ? 'index.html' : 'game.html?g=math20');
    } else {
        document.title = TITLES[name];
        const game = createGame(name);

        // 1. 渲染通用游戏界面
        renderGameLayout(document.getElementById('game-container'), { showExitButton: false, m_title: TITLES[name] });

        // 2. 初始化草稿板
        scratchpad.init('scratchpad-canvas');

        // 3. 初始化TTS开关
        game.setupTtsToggle();

        // 4. 渲染键盘
        renderKeypad('.keypad-container', game.handleKeypadInput);

        // 5. 开始出题
        game.makeQuiz();

        // Make functions global for uitemplate.js onclick handlers
        window.toggleHistory = game.toggleHistory;
        window.repeatQuestion = game.repeatQuestion;
    }
</script>
</body>
</html>
