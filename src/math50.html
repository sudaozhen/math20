<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 语音播报开关样式 */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; margin-right: 8px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success, #2196F3); }
        input:checked + .slider:before { transform: translateX(26px); }
        .stats-bar .stat-box { align-items: center; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 游戏通用布局将由 uitemplate.js 动态渲染 -->
</div>

<script src="uitemplate.js"></script>
<script src="tts.js"></script>
<script src="keypad.js"></script>
<script src="math50.js"></script>
<script>
    // 1. 渲染通用游戏界面 (不显示退出按钮)
    renderGameLayout(document.getElementById('game-container'), { showExitButton: false });
    // 2. 初始化TTS开关 (它现在由math20.js暴露)
    setupTtsToggle();
    // 3. 渲染键盘
    renderKeypad('.keypad-container', handleKeypadInput);
    // 4. 开始出题
    makeQuiz();
</script>
</body>
</html>
